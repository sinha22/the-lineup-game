<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Lineup</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #f5c842;
    --gold-dim: #c9a030;
    --bg: #09090e;
    --bg2: #0f0f17;
    --bg3: #16161f;
    --bg4: #1c1c28;
    --border: rgba(255,255,255,0.07);
    --border-gold: rgba(245,200,66,0.4);
    --text: #f0ede6;
    --text-muted: #6b6880;
    --text-mid: #a09daa;
    --green: #4ade80;
    --yellow: #f5c842;
    --red: #f87171;
    --radius: 12px;
    --radius-sm: 8px;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    overflow-x: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 0 0 40px;
  }

  /* HEADER */
  .header {
    width: 100%;
    max-width: 480px;
    padding: 32px 20px 0;
    text-align: center;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 52px;
    letter-spacing: 4px;
    color: var(--gold);
    line-height: 1;
    text-shadow: 0 0 40px rgba(245,200,66,0.2);
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 4px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--border-gold);
    margin: 16px auto;
  }

  /* STATS BAR */
  .stats-bar {
    display: flex;
    gap: 0;
    justify-content: center;
    margin-bottom: 20px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 20px;
    border-right: 1px solid var(--border);
  }

  .stat:last-child { border-right: none; }

  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 2px;
  }

  /* MAIN CONTAINER */
  .container {
    width: 100%;
    max-width: 480px;
    padding: 0 16px;
  }

  /* PUZZLE CARD */
  .puzzle-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 16px 18px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }

  .puzzle-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.5;
  }

  .puzzle-day {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 6px;
  }

  .puzzle-question {
    font-size: 15px;
    color: var(--text);
    line-height: 1.5;
  }

  .puzzle-question span {
    color: var(--gold);
    font-weight: 500;
  }

  .puzzle-category {
    display: inline-block;
    margin-top: 10px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold-dim);
    background: rgba(245,200,66,0.08);
    border: 1px solid rgba(245,200,66,0.15);
    border-radius: 4px;
    padding: 3px 8px;
  }

  /* ITEMS */
  .items-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }

  .item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    cursor: grab;
    transition: border-color 0.15s, background 0.15s, transform 0.1s, box-shadow 0.15s;
    touch-action: none;
    position: relative;
    -webkit-tap-highlight-color: transparent;
  }

  .item:hover {
    border-color: rgba(255,255,255,0.14);
    background: var(--bg4);
  }

  .item.dragging {
    opacity: 0.35;
    transform: scale(0.97);
    cursor: grabbing;
  }

  .item.drag-over {
    border-color: var(--gold);
    background: rgba(245,200,66,0.05);
    box-shadow: 0 0 0 1px rgba(245,200,66,0.2);
  }

  .item.touch-active {
    border-color: var(--gold);
    background: var(--bg4);
    transform: scale(1.02);
    box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    z-index: 100;
  }

  .item-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--gold);
    min-width: 26px;
    text-align: center;
    line-height: 1;
  }

  .item-name {
    font-size: 15px;
    font-weight: 500;
    flex: 1;
    color: var(--text);
  }

  .item-grip {
    display: flex;
    flex-direction: column;
    gap: 3px;
    opacity: 0.25;
    transition: opacity 0.15s;
  }

  .item:hover .item-grip { opacity: 0.5; }

  .grip-line {
    width: 18px;
    height: 1.5px;
    background: var(--text);
    border-radius: 2px;
  }

  /* SUBMIT BUTTON */
  .submit-btn {
    width: 100%;
    padding: 15px;
    background: var(--gold);
    color: #09090e;
    border: none;
    border-radius: var(--radius);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.1s;
    -webkit-tap-highlight-color: transparent;
  }

  .submit-btn:hover { opacity: 0.88; }
  .submit-btn:active { transform: scale(0.98); }
  .submit-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 10px;
    letter-spacing: 0.5px;
  }

  /* RESULT PHASE */
  .result-phase { display: none; }
  .result-phase.show { display: block; }

  /* SCORE CARD */
  .score-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px 20px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(12px);
    transition: opacity 0.4s, transform 0.4s;
  }

  .score-card.show { opacity: 1; transform: translateY(0); }

  .score-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .score-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 80px;
    color: var(--gold);
    line-height: 1;
    text-shadow: 0 0 60px rgba(245,200,66,0.3);
  }

  .score-denom {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--text-muted);
    margin-top: -4px;
  }

  .score-msg {
    font-size: 14px;
    color: var(--text-mid);
    margin-top: 10px;
    letter-spacing: 0.3px;
  }

  .score-streak {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 12px;
    font-size: 12px;
    color: var(--gold-dim);
    background: rgba(245,200,66,0.07);
    border: 1px solid rgba(245,200,66,0.15);
    border-radius: 20px;
    padding: 4px 12px;
    letter-spacing: 1px;
  }

  /* LEGEND */
  .legend {
    display: flex;
    gap: 16px;
    justify-content: center;
    margin-bottom: 12px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .dot {
    width: 8px;
    height: 8px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  .dot-green { background: var(--green); }
  .dot-yellow { background: var(--yellow); }
  .dot-red { background: var(--red); }

  /* RESULT ITEMS */
  .result-list {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-bottom: 16px;
  }

  .result-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 13px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    opacity: 0;
    transform: translateX(-8px);
    transition: opacity 0.3s, transform 0.3s, border-color 0.3s;
  }

  .result-item.exact { border-color: rgba(74,222,128,0.25); }
  .result-item.close { border-color: rgba(245,200,66,0.25); }
  .result-item.off { border-color: rgba(248,113,113,0.15); }
  .result-item.revealed { opacity: 1; transform: translateX(0); }

  .result-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    color: var(--gold);
    min-width: 26px;
    text-align: center;
    line-height: 1;
  }

  .result-info { flex: 1; }

  .result-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
  }

  .result-val {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .result-badge {
    width: 10px;
    height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }

  /* SHARE BUTTON */
  .share-btn {
    width: 100%;
    padding: 15px;
    background: transparent;
    color: var(--gold);
    border: 1px solid rgba(245,200,66,0.35);
    border-radius: var(--radius);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.2s, transform 0.1s;
    margin-bottom: 8px;
    -webkit-tap-highlight-color: transparent;
  }

  .share-btn:hover { background: rgba(245,200,66,0.06); border-color: rgba(245,200,66,0.6); }
  .share-btn:active { transform: scale(0.98); }

  .copied {
    text-align: center;
    font-size: 13px;
    color: var(--green);
    height: 20px;
    transition: opacity 0.3s;
  }

  /* TOMORROW */
  .tomorrow {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 14px;
    letter-spacing: 0.5px;
  }

  .tomorrow span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    color: var(--gold-dim);
    letter-spacing: 2px;
  }

  /* ALREADY PLAYED */
  .already-played {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 20px;
    text-align: center;
    margin-bottom: 16px;
  }

  .already-played p {
    font-size: 14px;
    color: var(--text-muted);
    line-height: 1.6;
  }

  /* FLOATING TOAST */
  .toast {
    position: fixed;
    bottom: 30px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: var(--bg4);
    border: 1px solid var(--border-gold);
    border-radius: 30px;
    padding: 10px 20px;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.5px;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    z-index: 999;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* MOBILE */
  @media (max-width: 400px) {
    .logo { font-size: 44px; }
    .score-big { font-size: 68px; }
    .item-name { font-size: 14px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">The Lineup</div>
  <div class="tagline">Daily Ranking Challenge</div>
  <div class="divider"></div>
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-val" id="statStreak">0</div>
      <div class="stat-label">Streak</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statPlayed">0</div>
      <div class="stat-label">Played</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statBest">—</div>
      <div class="stat-label">Best</div>
    </div>
  </div>
</div>

<div class="container">

  <!-- GAME PHASE -->
  <div id="gamePhase">
    <div class="puzzle-card">
      <div class="puzzle-day" id="puzzleDay">Day #1</div>
      <div class="puzzle-question" id="puzzleQuestion"></div>
      <div class="puzzle-category" id="puzzleCategory"></div>
    </div>

    <div class="items-list" id="itemsList"></div>

    <button class="submit-btn" id="submitBtn" onclick="submitGuess()">Lock In Your Lineup</button>
    <div class="hint">Drag to reorder · Tap to select then tap to place</div>
  </div>

  <!-- RESULT PHASE -->
  <div class="result-phase" id="resultPhase">
    <div class="score-card" id="scoreCard">
      <div class="score-big" id="scoreBig">0</div>
      <div class="score-denom">/ 100</div>
      <div class="score-msg" id="scoreMsg"></div>
      <div class="score-streak" id="scoreStreak">🔥 1 Day Streak</div>
    </div>

    <div class="legend">
      <div class="legend-item"><div class="dot dot-green"></div> Exact</div>
      <div class="legend-item"><div class="dot dot-yellow"></div> One off</div>
      <div class="legend-item"><div class="dot dot-red"></div> Off</div>
    </div>

    <div class="result-list" id="resultList"></div>

    <button class="share-btn" onclick="shareResult()">⬆ Share My Result</button>
    <div class="copied" id="copiedMsg"></div>

    <div class="tomorrow">Come back tomorrow for <span>Day #<span id="tomorrowNum">2</span></span></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ─── PUZZLES ──────────────────────────────────────────────────────────────────
const PUZZLES = [
  {
    category: "Wildlife",
    question: "Rank these 5 animals from <span>heaviest to lightest</span> by average adult weight",
    items: [
      { name: "African Elephant", value: 6000, display: "~6,000 kg" },
      { name: "Hippopotamus",     value: 1500, display: "~1,500 kg" },
      { name: "Polar Bear",       value: 450,  display: "~450 kg" },
      { name: "Giant Panda",      value: 120,  display: "~120 kg" },
      { name: "Cheetah",          value: 55,   display: "~55 kg" }
    ],
    order: "desc"
  },
  {
    category: "World",
    question: "Rank these 5 countries from <span>most to least populous</span> by current population",
    items: [
      { name: "India",         value: 1430, display: "1.43 billion" },
      { name: "China",         value: 1410, display: "1.41 billion" },
      { name: "United States", value: 335,  display: "335 million" },
      { name: "Indonesia",     value: 278,  display: "278 million" },
      { name: "Pakistan",      value: 232,  display: "232 million" }
    ],
    order: "desc"
  },
  {
    category: "Cinema",
    question: "Rank these 5 films from <span>highest to lowest</span> all-time worldwide box office gross",
    items: [
      { name: "Avatar",             value: 2923, display: "$2.92 billion" },
      { name: "Avengers: Endgame",  value: 2799, display: "$2.80 billion" },
      { name: "Titanic",            value: 2257, display: "$2.26 billion" },
      { name: "The Lion King (2019)",value: 1663, display: "$1.66 billion" },
      { name: "Jurassic World",     value: 1672, display: "$1.67 billion" }
    ],
    order: "desc"
  },
  {
    category: "Food",
    question: "Rank these 5 foods from <span>most to least calories</span> per 100g",
    items: [
      { name: "Butter",       value: 717, display: "717 kcal" },
      { name: "Dark Chocolate",value: 546, display: "546 kcal" },
      { name: "Cheddar Cheese",value: 403, display: "403 kcal" },
      { name: "White Rice",   value: 130, display: "130 kcal" },
      { name: "Apple",        value: 52,  display: "52 kcal" }
    ],
    order: "desc"
  },
  {
    category: "Space",
    question: "Rank these 5 planets from <span>largest to smallest</span> by diameter",
    items: [
      { name: "Jupiter", value: 139820, display: "139,820 km" },
      { name: "Saturn",  value: 116460, display: "116,460 km" },
      { name: "Uranus",  value: 50724,  display: "50,724 km" },
      { name: "Neptune", value: 49244,  display: "49,244 km" },
      { name: "Earth",   value: 12742,  display: "12,742 km" }
    ],
    order: "desc"
  },
  {
    category: "Speed",
    question: "Rank these 5 animals from <span>fastest to slowest</span> top speed",
    items: [
      { name: "Cheetah",      value: 120, display: "~120 km/h" },
      { name: "Pronghorn",    value: 98,  display: "~98 km/h" },
      { name: "Lion",         value: 80,  display: "~80 km/h" },
      { name: "Greyhound",    value: 72,  display: "~72 km/h" },
      { name: "Grizzly Bear", value: 56,  display: "~56 km/h" }
    ],
    order: "desc"
  },
  {
    category: "History",
    question: "Rank these 5 ancient wonders by <span>year built</span>, oldest first",
    items: [
      { name: "Great Pyramid of Giza",      value: -2560, display: "~2560 BC" },
      { name: "Hanging Gardens of Babylon", value: -600,  display: "~600 BC" },
      { name: "Temple of Artemis",          value: -550,  display: "~550 BC" },
      { name: "Colossus of Rhodes",         value: -280,  display: "~280 BC" },
      { name: "Lighthouse of Alexandria",   value: -247,  display: "~247 BC" }
    ],
    order: "asc"
  }
];

// ─── STATE ────────────────────────────────────────────────────────────────────
const today = new Date();
const todayKey = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
const dayNum = Math.floor((today - new Date(2025, 0, 1)) / 86400000) + 1;

const puzzleIdx = dayNum % PUZZLES.length;
const PUZZLE = PUZZLES[puzzleIdx];
const correctOrder = [...PUZZLE.items].sort((a, b) =>
  PUZZLE.order === 'desc' ? b.value - a.value : a.value - b.value
);

let currentOrder = shuffle([...PUZZLE.items]);
let dragSrcIdx = null;
let touchSrcIdx = null;
let touchClone = null;
let submitted = false;
let emojiGrid = [];

// ─── LOCAL STORAGE ────────────────────────────────────────────────────────────
function getStats() {
  try { return JSON.parse(localStorage.getItem('tl_stats') || '{}'); } catch { return {}; }
}
function saveStats(s) { localStorage.setItem('tl_stats', JSON.stringify(s)); }

function initStats() {
  const s = getStats();
  document.getElementById('statStreak').textContent = s.streak || 0;
  document.getElementById('statPlayed').textContent = s.played || 0;
  document.getElementById('statBest').textContent = s.best !== undefined ? s.best : '—';

  if (s.lastPlayed === todayKey) {
    // Already played today — show result directly
    submitted = true;
    document.getElementById('gamePhase').style.display = 'none';
    showStoredResult(s);
  }
}

// ─── PUZZLE SETUP ─────────────────────────────────────────────────────────────
function setup() {
  document.getElementById('puzzleDay').textContent = `Day #${dayNum}`;
  document.getElementById('puzzleQuestion').innerHTML = PUZZLE.question;
  document.getElementById('puzzleCategory').textContent = PUZZLE.category;
  document.getElementById('tomorrowNum').textContent = dayNum + 1;
  renderItems();
  initStats();
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── RENDER ITEMS ─────────────────────────────────────────────────────────────
function renderItems() {
  const list = document.getElementById('itemsList');
  list.innerHTML = '';
  currentOrder.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="item-num">${idx + 1}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-grip">
        <div class="grip-line"></div>
        <div class="grip-line"></div>
        <div class="grip-line"></div>
      </div>`;

    // Desktop drag
    el.draggable = true;
    el.addEventListener('dragstart', onDragStart);
    el.addEventListener('dragend', onDragEnd);
    el.addEventListener('dragover', onDragOver);
    el.addEventListener('dragleave', onDragLeave);
    el.addEventListener('drop', onDrop);

    // Mobile touch
    el.addEventListener('touchstart', onTouchStart, { passive: true });
    el.addEventListener('touchmove', onTouchMove, { passive: false });
    el.addEventListener('touchend', onTouchEnd);

    list.appendChild(el);
  });
}

// ─── DRAG & DROP (DESKTOP) ────────────────────────────────────────────────────
function onDragStart(e) {
  dragSrcIdx = parseInt(this.dataset.idx);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd() {
  this.classList.remove('dragging');
  document.querySelectorAll('.item').forEach(i => i.classList.remove('drag-over'));
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  this.classList.add('drag-over');
}

function onDragLeave() { this.classList.remove('drag-over'); }

function onDrop(e) {
  e.preventDefault();
  const targetIdx = parseInt(this.dataset.idx);
  if (dragSrcIdx !== null && dragSrcIdx !== targetIdx) {
    const tmp = currentOrder[dragSrcIdx];
    currentOrder[dragSrcIdx] = currentOrder[targetIdx];
    currentOrder[targetIdx] = tmp;
    renderItems();
  }
  dragSrcIdx = null;
}

// ─── TOUCH DRAG (MOBILE) ──────────────────────────────────────────────────────
function onTouchStart(e) {
  touchSrcIdx = parseInt(this.dataset.idx);
  this.classList.add('touch-active');
}

function onTouchMove(e) {
  e.preventDefault();
  const touch = e.touches[0];
  const els = document.querySelectorAll('.item');
  els.forEach(el => el.classList.remove('drag-over'));

  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  const itemEl = target && target.closest('.item');
  if (itemEl && itemEl !== this) itemEl.classList.add('drag-over');
}

function onTouchEnd(e) {
  this.classList.remove('touch-active');
  document.querySelectorAll('.item').forEach(el => {
    if (el.classList.contains('drag-over')) {
      const targetIdx = parseInt(el.dataset.idx);
      if (touchSrcIdx !== null && touchSrcIdx !== targetIdx) {
        const tmp = currentOrder[touchSrcIdx];
        currentOrder[touchSrcIdx] = currentOrder[targetIdx];
        currentOrder[targetIdx] = tmp;
        renderItems();
      }
      el.classList.remove('drag-over');
    }
  });
  touchSrcIdx = null;
}

// ─── SCORING ──────────────────────────────────────────────────────────────────
function calcScore() {
  let total = 0;
  emojiGrid = [];
  currentOrder.forEach((item, playerIdx) => {
    const correctIdx = correctOrder.findIndex(c => c.name === item.name);
    const diff = Math.abs(correctIdx - playerIdx);
    let pts, emoji, cls;
    if (diff === 0)      { pts = 20; emoji = '🟢'; cls = 'exact'; }
    else if (diff === 1) { pts = 10; emoji = '🟡'; cls = 'close'; }
    else if (diff === 2) { pts = 5;  emoji = '🔴'; cls = 'off'; }
    else                 { pts = 2;  emoji = '🔴'; cls = 'off'; }
    total += pts;
    emojiGrid.push({ emoji, cls, item, correctIdx });
  });
  return total;
}

function scoreMessage(s) {
  if (s === 100) return "Flawless. You cracked the case. 🕵️";
  if (s >= 80)  return "Sharp instincts. Almost perfect.";
  if (s >= 60)  return "Solid detective work.";
  if (s >= 40)  return "A few leads went cold. Try again tomorrow.";
  return "Back to the academy, recruit.";
}

// ─── SUBMIT ───────────────────────────────────────────────────────────────────
function submitGuess() {
  if (submitted) return;
  submitted = true;
  document.getElementById('submitBtn').disabled = true;

  const score = calcScore();
  const s = getStats();
  s.played = (s.played || 0) + 1;
  s.best = s.best !== undefined ? Math.max(s.best, score) : score;
  s.streak = s.lastPlayed === getPrevDayKey() ? (s.streak || 0) + 1 : 1;
  s.lastPlayed = todayKey;
  s.lastScore = score;
  s.lastEmoji = emojiGrid.map(r => r.emoji).join('');
  s.lastCorrect = correctOrder.map(i => ({ name: i.name, display: i.display }));
  s.lastPlayerOrder = currentOrder.map(i => i.name);
  saveStats(s);

  updateStatDisplay(s);
  showResult(score, s.streak, emojiGrid);
}

function getPrevDayKey() {
  const d = new Date(today);
  d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function updateStatDisplay(s) {
  document.getElementById('statStreak').textContent = s.streak || 0;
  document.getElementById('statPlayed').textContent = s.played || 0;
  document.getElementById('statBest').textContent = s.best !== undefined ? s.best : '—';
}

// ─── SHOW RESULT ──────────────────────────────────────────────────────────────
function showResult(score, streak, grid) {
  document.getElementById('gamePhase').style.display = 'none';
  const rp = document.getElementById('resultPhase');
  rp.classList.add('show');

  setTimeout(() => {
    document.getElementById('scoreBig').textContent = score;
    document.getElementById('scoreMsg').textContent = scoreMessage(score);
    document.getElementById('scoreStreak').textContent = `🔥 ${streak} Day Streak`;
    document.getElementById('scoreCard').classList.add('show');
  }, 100);

  const rl = document.getElementById('resultList');
  rl.innerHTML = '';
  correctOrder.forEach((item, idx) => {
    const r = grid.find(g => g.item.name === item.name) || emojiGrid.find(g => g.correctIdx === idx);
    const dotColor = r ? (r.cls === 'exact' ? 'dot-green' : r.cls === 'close' ? 'dot-yellow' : 'dot-red') : 'dot-red';
    const borderCls = r ? r.cls : 'off';

    const el = document.createElement('div');
    el.className = `result-item ${borderCls}`;
    el.innerHTML = `
      <div class="result-rank">${idx + 1}</div>
      <div class="result-info">
        <div class="result-name">${item.name}</div>
        <div class="result-val">${item.display}</div>
      </div>
      <div class="result-badge dot ${dotColor}"></div>`;
    rl.appendChild(el);
    setTimeout(() => el.classList.add('revealed'), 300 + idx * 130);
  });
}

function showStoredResult(s) {
  const rp = document.getElementById('resultPhase');
  rp.classList.add('show');

  const fakeGrid = correctOrder.map((item, correctIdx) => {
    const playerIdx = (s.lastPlayerOrder || []).indexOf(item.name);
    const diff = playerIdx !== -1 ? Math.abs(correctIdx - playerIdx) : 4;
    const cls = diff === 0 ? 'exact' : diff === 1 ? 'close' : 'off';
    const emoji = diff === 0 ? '🟢' : diff === 1 ? '🟡' : '🔴';
    return { emoji, cls, item, correctIdx };
  });

  setTimeout(() => {
    document.getElementById('scoreBig').textContent = s.lastScore || 0;
    document.getElementById('scoreMsg').textContent = scoreMessage(s.lastScore || 0);
    document.getElementById('scoreStreak').textContent = `🔥 ${s.streak || 1} Day Streak`;
    document.getElementById('scoreCard').classList.add('show');
    updateStatDisplay(s);
  }, 100);

  const rl = document.getElementById('resultList');
  rl.innerHTML = '';
  correctOrder.forEach((item, idx) => {
    const r = fakeGrid[idx];
    const dotColor = r.cls === 'exact' ? 'dot-green' : r.cls === 'close' ? 'dot-yellow' : 'dot-red';
    const el = document.createElement('div');
    el.className = `result-item ${r.cls}`;
    el.innerHTML = `
      <div class="result-rank">${idx + 1}</div>
      <div class="result-info">
        <div class="result-name">${item.name}</div>
        <div class="result-val">${item.display}</div>
      </div>
      <div class="result-badge dot ${dotColor}"></div>`;
    rl.appendChild(el);
    setTimeout(() => el.classList.add('revealed'), 200 + idx * 100);
  });
}

// ─── SHARE ────────────────────────────────────────────────────────────────────
function shareResult() {
  const s = getStats();
  const score = parseInt(document.getElementById('scoreBig').textContent);
  const emojis = s.lastEmoji || emojiGrid.map(r => r.emoji).join('');
  const text = `🔦 The Lineup — Day #${dayNum}\n\n${emojis}\n\nScore: ${score}/100  🔥 ${s.streak || 1} streak\n\nPlay at thelineup.game`;

  navigator.clipboard.writeText(text).then(() => {
    showToast('Result copied to clipboard!');
  }).catch(() => {
    showToast('Copy not supported — try long press');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2400);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
setup();
</script>
