<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>The Lineup — Daily Ranking Challenge</title>
<meta name="description" content="Every day, 5 items. One correct order. Can you crack the lineup?">
<meta property="og:title" content="The Lineup">
<meta property="og:description" content="Daily ranking challenge — drag, rank, share.">
<meta property="og:url" content="https://thegameforge.win">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet">

<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --gold: #f5c842;
    --gold-dim: #c9a030;
    --gold-glow: rgba(245,200,66,0.15);
    --bg: #09090e;
    --bg2: #0f0f17;
    --bg3: #16161f;
    --bg4: #1c1c28;
    --border: rgba(255,255,255,0.07);
    --border-gold: rgba(245,200,66,0.4);
    --text: #f0ede6;
    --text-muted: #6b6880;
    --text-mid: #a09daa;
    --green: #4ade80;
    --yellow: #f5c842;
    --red: #f87171;
    --radius: 14px;
    --radius-sm: 8px;
  }

  html, body {
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    min-height: 100vh;
    min-height: 100dvh;
    overflow-x: hidden;
    -webkit-font-smoothing: antialiased;
  }

  body {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 0 60px;
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    max-width: 520px;
    padding: 36px 20px 0;
    text-align: center;
  }

  .logo {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 56px;
    letter-spacing: 5px;
    color: var(--gold);
    line-height: 1;
    text-shadow: 0 0 60px rgba(245,200,66,0.25);
  }

  .tagline {
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 5px;
  }

  .divider {
    width: 40px;
    height: 1px;
    background: var(--border-gold);
    margin: 18px auto;
  }

  /* ── STATS ── */
  .stats-bar {
    display: flex;
    justify-content: center;
    margin-bottom: 24px;
  }

  .stat {
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 0 22px;
    border-right: 1px solid var(--border);
  }

  .stat:last-child { border-right: none; }

  .stat-val {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 28px;
    color: var(--gold);
    line-height: 1;
  }

  .stat-label {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-top: 3px;
  }

  /* ── CONTAINER ── */
  .container {
    width: 100%;
    max-width: 520px;
    padding: 0 16px;
  }

  /* ── PUZZLE CARD ── */
  .puzzle-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 18px 20px;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
    animation: fadeUp 0.4s ease both;
  }

  .puzzle-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    opacity: 0.6;
  }

  .puzzle-day {
    font-size: 10px;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--text-muted);
    margin-bottom: 8px;
  }

  .puzzle-question {
    font-size: 15px;
    color: var(--text);
    line-height: 1.55;
  }

  .puzzle-question span { color: var(--gold); font-weight: 500; }

  .puzzle-category {
    display: inline-block;
    margin-top: 12px;
    font-size: 10px;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--gold-dim);
    background: rgba(245,200,66,0.08);
    border: 1px solid rgba(245,200,66,0.15);
    border-radius: 4px;
    padding: 3px 9px;
  }

  /* ── ITEMS LIST ── */
  .items-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-bottom: 16px;
  }

  .item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 15px 16px;
    display: flex;
    align-items: center;
    gap: 13px;
    cursor: grab;
    touch-action: none;
    position: relative;
    -webkit-tap-highlight-color: transparent;
    transition: border-color 0.18s, background 0.18s, box-shadow 0.18s, transform 0.18s, opacity 0.18s;
    will-change: transform;
    animation: fadeUp 0.35s ease both;
  }

  .item:nth-child(1) { animation-delay: 0.05s; }
  .item:nth-child(2) { animation-delay: 0.10s; }
  .item:nth-child(3) { animation-delay: 0.15s; }
  .item:nth-child(4) { animation-delay: 0.20s; }
  .item:nth-child(5) { animation-delay: 0.25s; }

  .item:hover {
    border-color: rgba(255,255,255,0.13);
    background: var(--bg4);
  }

  /* Desktop drag states */
  .item.dragging {
    opacity: 0.3;
    transform: scale(0.96);
    cursor: grabbing;
    border-color: var(--border);
  }

  .item.drag-over {
    border-color: var(--gold);
    background: rgba(245,200,66,0.06);
    box-shadow: 0 0 0 1px rgba(245,200,66,0.25), 0 4px 20px rgba(245,200,66,0.08);
    transform: scale(1.01);
  }

  /* Mobile touch — floating clone effect */
  .item.touch-lifted {
    opacity: 0.25;
    transform: scale(0.97);
  }

  .item.touch-target {
    border-color: var(--gold);
    background: rgba(245,200,66,0.06);
    box-shadow: 0 0 0 1px rgba(245,200,66,0.3);
  }

  /* Floating drag clone */
  .drag-clone {
    position: fixed;
    pointer-events: none;
    z-index: 9999;
    border-radius: var(--radius);
    background: var(--bg4);
    border: 1px solid var(--gold);
    box-shadow: 0 12px 40px rgba(0,0,0,0.7), 0 0 0 1px rgba(245,200,66,0.3);
    transform: scale(1.04) rotate(1deg);
    transition: none;
    opacity: 0.97;
    padding: 15px 16px;
    display: flex;
    align-items: center;
    gap: 13px;
    font-family: 'DM Sans', sans-serif;
  }

  .item-num {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--gold);
    min-width: 26px;
    text-align: center;
    line-height: 1;
  }

  .item-name {
    font-size: 15px;
    font-weight: 500;
    flex: 1;
    color: var(--text);
  }

  .item-grip {
    display: flex;
    flex-direction: column;
    gap: 3.5px;
    opacity: 0.2;
    transition: opacity 0.15s;
    flex-shrink: 0;
  }

  .item:hover .item-grip,
  .drag-clone .item-grip { opacity: 0.5; }

  .grip-line {
    width: 18px;
    height: 1.5px;
    background: var(--text);
    border-radius: 2px;
  }

  /* swap flash animation */
  @keyframes swapFlash {
    0% { background: rgba(245,200,66,0.12); }
    100% { background: var(--bg3); }
  }
  .item.swapped { animation: swapFlash 0.35s ease forwards; }

  /* ── SUBMIT ── */
  .submit-btn {
    width: 100%;
    padding: 16px;
    background: var(--gold);
    color: #09090e;
    border: none;
    border-radius: var(--radius);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 23px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: opacity 0.15s, transform 0.12s, box-shadow 0.15s;
    -webkit-tap-highlight-color: transparent;
    box-shadow: 0 4px 24px rgba(245,200,66,0.2);
  }

  .submit-btn:hover { opacity: 0.88; box-shadow: 0 6px 32px rgba(245,200,66,0.3); }
  .submit-btn:active { transform: scale(0.975); }
  .submit-btn:disabled { opacity: 0.3; cursor: not-allowed; transform: none; box-shadow: none; }

  .hint {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 11px;
    letter-spacing: 0.3px;
  }

  /* ── RESULT ── */
  .result-phase { display: none; }
  .result-phase.show { display: block; }

  .score-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 28px 20px;
    text-align: center;
    margin-bottom: 16px;
    position: relative;
    overflow: hidden;
    opacity: 0;
    transform: translateY(14px);
    transition: opacity 0.45s cubic-bezier(.16,1,.3,1), transform 0.45s cubic-bezier(.16,1,.3,1);
  }

  .score-card.show { opacity: 1; transform: translateY(0); }

  .score-card::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
  }

  .score-big {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 88px;
    color: var(--gold);
    line-height: 1;
    text-shadow: 0 0 80px rgba(245,200,66,0.35);
  }

  .score-denom {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--text-muted);
    margin-top: -6px;
  }

  .score-msg {
    font-size: 14px;
    color: var(--text-mid);
    margin-top: 12px;
    letter-spacing: 0.3px;
  }

  .score-streak {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: 14px;
    font-size: 12px;
    color: var(--gold-dim);
    background: rgba(245,200,66,0.07);
    border: 1px solid rgba(245,200,66,0.15);
    border-radius: 20px;
    padding: 5px 14px;
    letter-spacing: 1px;
  }

  /* ── LEGEND ── */
  .legend {
    display: flex;
    gap: 18px;
    justify-content: center;
    margin-bottom: 12px;
  }

  .legend-item {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    color: var(--text-muted);
  }

  .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .dot-green { background: var(--green); }
  .dot-yellow { background: var(--yellow); }
  .dot-red { background: var(--red); }

  /* ── RESULT ITEMS ── */
  .result-list {
    display: flex;
    flex-direction: column;
    gap: 9px;
    margin-bottom: 16px;
  }

  .result-item {
    background: var(--bg3);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 14px 16px;
    display: flex;
    align-items: center;
    gap: 13px;
    opacity: 0;
    transform: translateX(-10px);
    transition: opacity 0.32s ease, transform 0.32s ease, border-color 0.32s ease;
  }

  .result-item.exact { border-color: rgba(74,222,128,0.3); }
  .result-item.close { border-color: rgba(245,200,66,0.3); }
  .result-item.off   { border-color: rgba(248,113,113,0.18); }
  .result-item.revealed { opacity: 1; transform: translateX(0); }

  .result-rank {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 24px;
    color: var(--gold);
    min-width: 26px;
    text-align: center;
    line-height: 1;
  }

  .result-info { flex: 1; min-width: 0; }

  .result-name {
    font-size: 15px;
    font-weight: 500;
    color: var(--text);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .result-val {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 2px;
  }

  .result-badge { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }

  /* ── SHARE ── */
  .share-btn {
    width: 100%;
    padding: 16px;
    background: transparent;
    color: var(--gold);
    border: 1px solid rgba(245,200,66,0.35);
    border-radius: var(--radius);
    font-family: 'Bebas Neue', sans-serif;
    font-size: 23px;
    letter-spacing: 3px;
    cursor: pointer;
    transition: background 0.15s, border-color 0.2s, transform 0.12s;
    margin-bottom: 8px;
    -webkit-tap-highlight-color: transparent;
  }

  .share-btn:hover { background: rgba(245,200,66,0.06); border-color: rgba(245,200,66,0.6); }
  .share-btn:active { transform: scale(0.975); }

  .copied { text-align: center; font-size: 13px; color: var(--green); height: 20px; }

  .tomorrow {
    text-align: center;
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 16px;
    letter-spacing: 0.4px;
  }

  .tomorrow span {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 16px;
    color: var(--gold-dim);
    letter-spacing: 2px;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 32px;
    left: 50%;
    transform: translateX(-50%) translateY(16px);
    background: var(--bg4);
    border: 1px solid var(--border-gold);
    border-radius: 30px;
    padding: 11px 22px;
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 0.5px;
    opacity: 0;
    transition: opacity 0.25s, transform 0.25s cubic-bezier(.16,1,.3,1);
    pointer-events: none;
    z-index: 9998;
    white-space: nowrap;
  }

  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* ── ANIMATIONS ── */
  @keyframes fadeUp {
    from { opacity: 0; transform: translateY(10px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  /* ── RESPONSIVE ── */
  @media (max-width: 380px) {
    .logo { font-size: 46px; }
    .score-big { font-size: 72px; }
    .item-name { font-size: 14px; }
    .submit-btn, .share-btn { font-size: 20px; }
    .stat { padding: 0 14px; }
  }

  @media (min-width: 600px) {
    .logo { font-size: 64px; }
    .item { padding: 17px 20px; }
    .item-name { font-size: 16px; }
  }

  @media (min-width: 900px) {
    .container, .header { max-width: 560px; }
  }
</style>
</head>
<body>

<div class="header">
  <div class="logo">The Lineup</div>
  <div class="tagline">Daily Ranking Challenge · thegameforge.win</div>
  <div class="divider"></div>
  <div class="stats-bar">
    <div class="stat">
      <div class="stat-val" id="statStreak">0</div>
      <div class="stat-label">Streak</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statPlayed">0</div>
      <div class="stat-label">Played</div>
    </div>
    <div class="stat">
      <div class="stat-val" id="statBest">—</div>
      <div class="stat-label">Best</div>
    </div>
  </div>
</div>

<div class="container">

  <div id="gamePhase">
    <div class="puzzle-card">
      <div class="puzzle-day" id="puzzleDay">Day #—</div>
      <div class="puzzle-question" id="puzzleQuestion"><span style="color:var(--text-muted);font-size:13px;letter-spacing:1px">Loading today's lineup...</span></div>
      <div class="puzzle-category" id="puzzleCategory" style="opacity:0">—</div>
    </div>
    <div class="items-list" id="itemsList"></div>
    <button class="submit-btn" id="submitBtn" onclick="submitGuess()" disabled>Lock In Your Lineup</button>
    <div class="hint" id="hintText">Loading...</div>
  </div>

  <div class="result-phase" id="resultPhase">
    <div class="score-card" id="scoreCard">
      <div class="score-big" id="scoreBig">0</div>
      <div class="score-denom">/ 100</div>
      <div class="score-msg" id="scoreMsg"></div>
      <div class="score-streak" id="scoreStreak">🔥 1 Day Streak</div>
    </div>
    <div class="legend">
      <div class="legend-item"><div class="dot dot-green"></div> Exact</div>
      <div class="legend-item"><div class="dot dot-yellow"></div> One off</div>
      <div class="legend-item"><div class="dot dot-red"></div> Off</div>
    </div>
    <div class="result-list" id="resultList"></div>
    <button class="share-btn" onclick="shareResult()">⬆ Share My Result</button>
    <div class="copied" id="copiedMsg"></div>
    <div class="tomorrow">Come back tomorrow for <span>Day #<span id="tomorrowNum">—</span></span></div>
  </div>

</div>

<div class="toast" id="toast"></div>

<script>
// ─── CONFIG ───────────────────────────────────────────────────────────────────
const WORKER_URL = 'https://lineup-puzzle-generator.sinhautkarsh-1.workers.dev';

// ─── STATE ────────────────────────────────────────────────────────────────────
const today = new Date();
const todayKey = `${today.getFullYear()}-${today.getMonth()}-${today.getDate()}`;
const dayNum = Math.floor((today - new Date(2025, 0, 1)) / 86400000) + 1;

let PUZZLE = null;
let correctOrder = [];
let currentOrder = [];
let dragSrcIdx = null;
let submitted = false;
let emojiGrid = [];

// Touch drag state
let touchSrcIdx = null;
let touchClone = null;
let touchCloneWidth = 0;
let touchOffsetX = 0;
let touchOffsetY = 0;

// ─── LOCAL STORAGE ────────────────────────────────────────────────────────────
function getStats() {
  try { return JSON.parse(localStorage.getItem('tl_stats') || '{}'); } catch { return {}; }
}
function saveStats(s) { localStorage.setItem('tl_stats', JSON.stringify(s)); }

function initStats() {
  const s = getStats();
  document.getElementById('statStreak').textContent = s.streak || 0;
  document.getElementById('statPlayed').textContent = s.played || 0;
  document.getElementById('statBest').textContent = s.best !== undefined ? s.best : '—';
  if (s.lastPlayed === todayKey) {
    submitted = true;
    document.getElementById('gamePhase').style.display = 'none';
    showStoredResult(s);
  }
}

// ─── SETUP ────────────────────────────────────────────────────────────────────
async function setup() {
  document.getElementById('puzzleDay').textContent = `Day #${dayNum}`;
  document.getElementById('tomorrowNum').textContent = dayNum + 1;
  initStats();
  if (submitted) return;

  try {
    const res = await fetch(WORKER_URL);
    if (!res.ok) throw new Error('Worker error');
    PUZZLE = await res.json();
    if (PUZZLE.error) throw new Error(PUZZLE.error);

    correctOrder = [...PUZZLE.items].sort((a, b) =>
      PUZZLE.order === 'desc' ? b.value - a.value : a.value - b.value
    );
    currentOrder = shuffle([...PUZZLE.items]);

    const pDay = PUZZLE.dayNum || dayNum;
    document.getElementById('puzzleDay').textContent = `Day #${pDay}`;
    document.getElementById('puzzleQuestion').innerHTML = PUZZLE.question;
    document.getElementById('puzzleCategory').textContent = PUZZLE.category;
    document.getElementById('puzzleCategory').style.opacity = '1';
    document.getElementById('tomorrowNum').textContent = pDay + 1;
    document.getElementById('submitBtn').disabled = false;
    document.getElementById('hintText').textContent = 'Drag to reorder · Hold and drag on mobile';
    renderItems();

  } catch (err) {
    console.error('Puzzle fetch failed:', err);
    document.getElementById('puzzleQuestion').innerHTML = '<span style="color:var(--red);font-size:13px">Failed to load puzzle. Please refresh.</span>';
    document.getElementById('hintText').textContent = '';
  }
}

function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

// ─── RENDER ITEMS ─────────────────────────────────────────────────────────────
function renderItems() {
  const list = document.getElementById('itemsList');
  list.innerHTML = '';
  currentOrder.forEach((item, idx) => {
    const el = document.createElement('div');
    el.className = 'item';
    el.dataset.idx = idx;
    el.innerHTML = `
      <div class="item-num">${idx + 1}</div>
      <div class="item-name">${item.name}</div>
      <div class="item-grip">
        <div class="grip-line"></div>
        <div class="grip-line"></div>
        <div class="grip-line"></div>
      </div>`;

    // Desktop
    el.draggable = true;
    el.addEventListener('dragstart', onDragStart);
    el.addEventListener('dragend', onDragEnd);
    el.addEventListener('dragover', onDragOver);
    el.addEventListener('dragleave', onDragLeave);
    el.addEventListener('drop', onDrop);

    // Mobile
    el.addEventListener('touchstart', onTouchStart, { passive: false });
    el.addEventListener('touchmove', onTouchMove, { passive: false });
    el.addEventListener('touchend', onTouchEnd);

    list.appendChild(el);
  });
}

// ─── DESKTOP DRAG ─────────────────────────────────────────────────────────────
function onDragStart(e) {
  dragSrcIdx = parseInt(this.dataset.idx);
  this.classList.add('dragging');
  e.dataTransfer.effectAllowed = 'move';
}

function onDragEnd() {
  dragSrcIdx = null;
  document.querySelectorAll('.item').forEach(i => {
    i.classList.remove('dragging', 'drag-over', 'drag-above', 'drag-below');
  });
}

function onDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  document.querySelectorAll('.item').forEach(i => i.classList.remove('drag-over'));
  this.classList.add('drag-over');
}

function onDragLeave(e) {
  if (!this.contains(e.relatedTarget)) this.classList.remove('drag-over');
}

function onDrop(e) {
  e.preventDefault();
  const targetIdx = parseInt(this.dataset.idx);
  if (dragSrcIdx !== null && dragSrcIdx !== targetIdx) {
    insertItem(dragSrcIdx, targetIdx);
  }
  dragSrcIdx = null;
}

// ─── MOBILE TOUCH DRAG (floating clone + insert) ──────────────────────────────
function onTouchStart(e) {
  e.preventDefault();
  const touch = e.touches[0];
  touchSrcIdx = parseInt(this.dataset.idx);

  const rect = this.getBoundingClientRect();
  touchOffsetX = touch.clientX - rect.left;
  touchOffsetY = touch.clientY - rect.top;
  touchCloneWidth = rect.width;

  touchClone = document.createElement('div');
  touchClone.className = 'drag-clone';
  touchClone.style.width = touchCloneWidth + 'px';
  touchClone.innerHTML = this.innerHTML;
  touchClone.style.left = (touch.clientX - touchOffsetX) + 'px';
  touchClone.style.top = (touch.clientY - touchOffsetY + window.scrollY) + 'px';
  document.body.appendChild(touchClone);

  this.classList.add('touch-lifted');
  if (navigator.vibrate) navigator.vibrate(30);
}

function onTouchMove(e) {
  e.preventDefault();
  if (!touchClone) return;
  const touch = e.touches[0];

  touchClone.style.left = (touch.clientX - touchOffsetX) + 'px';
  touchClone.style.top = (touch.clientY - touchOffsetY + window.scrollY) + 'px';

  // Find which item we're hovering over
  document.querySelectorAll('.item').forEach(el => el.classList.remove('touch-target'));
  touchClone.style.visibility = 'hidden';
  const target = document.elementFromPoint(touch.clientX, touch.clientY);
  touchClone.style.visibility = '';
  const itemEl = target && target.closest('.item');
  if (itemEl && parseInt(itemEl.dataset.idx) !== touchSrcIdx) {
    itemEl.classList.add('touch-target');
  }
}

function onTouchEnd(e) {
  if (!touchClone) return;
  const touch = e.changedTouches[0];

  touchClone.remove();
  touchClone = null;
  document.querySelectorAll('.item').forEach(el => el.classList.remove('touch-target', 'touch-lifted'));

  // Find drop target by position
  let targetIdx = null;
  document.querySelectorAll('.item').forEach(el => {
    const rect = el.getBoundingClientRect();
    if (touch.clientX >= rect.left && touch.clientX <= rect.right &&
        touch.clientY >= rect.top  && touch.clientY <= rect.bottom) {
      targetIdx = parseInt(el.dataset.idx);
    }
  });

  if (targetIdx !== null && targetIdx !== touchSrcIdx) {
    insertItem(touchSrcIdx, targetIdx);
    if (navigator.vibrate) navigator.vibrate(15);
  } else {
    renderItems();
  }

  touchSrcIdx = null;
}

// ─── INSERT (reorder, not swap) ───────────────────────────────────────────────
function insertItem(fromIdx, toIdx) {
  // Remove item from its position and insert at target position
  const item = currentOrder.splice(fromIdx, 1)[0];
  currentOrder.splice(toIdx, 0, item);
  renderItems();
  // Flash the moved item at its new position
  const els = document.querySelectorAll('.item');
  if (els[toIdx]) {
    els[toIdx].classList.add('swapped');
    setTimeout(() => els[toIdx].classList.remove('swapped'), 400);
  }
}

// ─── SCORING ──────────────────────────────────────────────────────────────────
function calcScore() {
  let total = 0;
  emojiGrid = [];
  currentOrder.forEach((item, playerIdx) => {
    const correctIdx = correctOrder.findIndex(c => c.name === item.name);
    const diff = Math.abs(correctIdx - playerIdx);
    let pts, emoji, cls;
    if (diff === 0)      { pts = 20; emoji = '🟢'; cls = 'exact'; }
    else if (diff === 1) { pts = 10; emoji = '🟡'; cls = 'close'; }
    else if (diff === 2) { pts = 5;  emoji = '🔴'; cls = 'off'; }
    else                 { pts = 2;  emoji = '🔴'; cls = 'off'; }
    total += pts;
    emojiGrid.push({ emoji, cls, item, correctIdx });
  });
  return total;
}

function scoreMessage(s) {
  if (s === 100) return "Flawless. You cracked the case. 🕵️";
  if (s >= 80)  return "Sharp instincts. Almost perfect.";
  if (s >= 60)  return "Solid detective work.";
  if (s >= 40)  return "A few leads went cold. Try again tomorrow.";
  return "Back to the academy, recruit.";
}

// ─── SUBMIT ───────────────────────────────────────────────────────────────────
function submitGuess() {
  if (submitted || !PUZZLE) return;
  submitted = true;
  document.getElementById('submitBtn').disabled = true;

  const score = calcScore();
  const s = getStats();
  s.played = (s.played || 0) + 1;
  s.best = s.best !== undefined ? Math.max(s.best, score) : score;
  s.streak = s.lastPlayed === getPrevDayKey() ? (s.streak || 0) + 1 : 1;
  s.lastPlayed = todayKey;
  s.lastScore = score;
  s.lastEmoji = emojiGrid.map(r => r.emoji).join('');
  s.lastCorrect = correctOrder.map(i => ({ name: i.name, display: i.display }));
  s.lastPlayerOrder = currentOrder.map(i => i.name);
  s.lastDayNum = PUZZLE.dayNum || dayNum;
  saveStats(s);

  updateStatDisplay(s);
  showResult(score, s.streak, emojiGrid);

  // GA event
  if (typeof gtag !== 'undefined') {
    gtag('event', 'puzzle_completed', { score, streak: s.streak });
  }
}

function getPrevDayKey() {
  const d = new Date(today);
  d.setDate(d.getDate() - 1);
  return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`;
}

function updateStatDisplay(s) {
  document.getElementById('statStreak').textContent = s.streak || 0;
  document.getElementById('statPlayed').textContent = s.played || 0;
  document.getElementById('statBest').textContent = s.best !== undefined ? s.best : '—';
}

// ─── SHOW RESULT ──────────────────────────────────────────────────────────────
function showResult(score, streak, grid) {
  document.getElementById('gamePhase').style.display = 'none';
  document.getElementById('resultPhase').classList.add('show');

  setTimeout(() => {
    document.getElementById('scoreBig').textContent = score;
    document.getElementById('scoreMsg').textContent = scoreMessage(score);
    document.getElementById('scoreStreak').textContent = `🔥 ${streak} Day Streak`;
    document.getElementById('scoreCard').classList.add('show');
  }, 80);

  const rl = document.getElementById('resultList');
  rl.innerHTML = '';
  correctOrder.forEach((item, idx) => {
    const r = grid.find(g => g.item.name === item.name);
    const cls = r ? r.cls : 'off';
    const dotColor = cls === 'exact' ? 'dot-green' : cls === 'close' ? 'dot-yellow' : 'dot-red';
    const el = document.createElement('div');
    el.className = `result-item ${cls}`;
    el.innerHTML = `
      <div class="result-rank">${idx + 1}</div>
      <div class="result-info">
        <div class="result-name">${item.name}</div>
        <div class="result-val">${item.display}</div>
      </div>
      <div class="result-badge dot ${dotColor}"></div>`;
    rl.appendChild(el);
    setTimeout(() => el.classList.add('revealed'), 280 + idx * 120);
  });
}

function showStoredResult(s) {
  document.getElementById('resultPhase').classList.add('show');

  const storedDay = s.lastDayNum || dayNum;
  document.getElementById('tomorrowNum').textContent = storedDay + 1;

  const fakeGrid = (s.lastPlayerOrder || []).map((name, playerIdx) => {
    const correctIdx = (s.lastCorrect || []).findIndex(c => c.name === name);
    const diff = correctIdx !== -1 ? Math.abs(correctIdx - playerIdx) : 4;
    return {
      cls: diff === 0 ? 'exact' : diff === 1 ? 'close' : 'off',
      emoji: diff === 0 ? '🟢' : diff === 1 ? '🟡' : '🔴'
    };
  });

  setTimeout(() => {
    document.getElementById('scoreBig').textContent = s.lastScore || 0;
    document.getElementById('scoreMsg').textContent = scoreMessage(s.lastScore || 0);
    document.getElementById('scoreStreak').textContent = `🔥 ${s.streak || 1} Day Streak`;
    document.getElementById('scoreCard').classList.add('show');
    updateStatDisplay(s);
  }, 80);

  const rl = document.getElementById('resultList');
  rl.innerHTML = '';
  (s.lastCorrect || []).forEach((item, idx) => {
    const r = fakeGrid[idx] || { cls: 'off' };
    const dotColor = r.cls === 'exact' ? 'dot-green' : r.cls === 'close' ? 'dot-yellow' : 'dot-red';
    const el = document.createElement('div');
    el.className = `result-item ${r.cls}`;
    el.innerHTML = `
      <div class="result-rank">${idx + 1}</div>
      <div class="result-info">
        <div class="result-name">${item.name}</div>
        <div class="result-val">${item.display}</div>
      </div>
      <div class="result-badge dot ${dotColor}"></div>`;
    rl.appendChild(el);
    setTimeout(() => el.classList.add('revealed'), 200 + idx * 100);
  });
}

// ─── SHARE ────────────────────────────────────────────────────────────────────
function shareResult() {
  const s = getStats();
  const score = parseInt(document.getElementById('scoreBig').textContent);
  const emojis = s.lastEmoji || emojiGrid.map(r => r.emoji).join('');
  const sharedDay = s.lastDayNum || dayNum;
  const text = `🔦 The Lineup — Day #${sharedDay}\n\n${emojis}\n\nScore: ${score}/100  🔥 ${s.streak || 1} streak\n\nPlay at thegameforge.win`;

  if (navigator.share) {
    navigator.share({ title: 'The Lineup', text }).catch(() => copyToClipboard(text));
  } else {
    copyToClipboard(text);
  }

  if (typeof gtag !== 'undefined') gtag('event', 'share_result');
}

function copyToClipboard(text) {
  navigator.clipboard.writeText(text).then(() => {
    showToast('Result copied to clipboard!');
  }).catch(() => {
    showToast('Long press to copy');
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2600);
}

// ─── INIT ─────────────────────────────────────────────────────────────────────
setup();
</script>
