<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>The Game Forge — Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #09090e; --bg2: #0f0f17; --bg3: #16161f;
    --border: rgba(255,255,255,0.07);
    --text: #f0ede6; --text-mid: #a09daa; --text-muted: #6b6880;
    --gold: #f5c842; --green: #4ade80; --red: #f87171; --amber: #fb923c;
    --radius: 12px;
  }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding: 32px 16px 60px; }
  .container { max-width: 560px; margin: 0 auto; }
  .header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 24px; }
  .title { font-size: 22px; font-weight: 500; color: var(--gold); }
  .subtitle { font-size: 12px; color: var(--text-muted); letter-spacing: 1px; margin-top: 3px; }
  .refresh-btn { background: transparent; border: 1px solid var(--border); border-radius: 8px; color: var(--text-muted); font-size: 13px; padding: 7px 14px; cursor: pointer; display: flex; align-items: center; gap: 6px; font-family: 'DM Sans', sans-serif; transition: border-color 0.15s, color 0.15s; }
  .refresh-btn:hover { border-color: rgba(255,255,255,0.15); color: var(--text); }
  .refresh-btn.spinning i { animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .overall { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px 18px; display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
  .overall-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
  .overall-dot.ok { background: var(--green); }
  .overall-dot.error { background: var(--red); }
  .overall-dot.checking { background: var(--amber); animation: pulse 1.2s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity:1; } 50% { opacity:0.4; } }
  .overall-text { font-size: 14px; font-weight: 500; }
  .overall-sub { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 16px; border-left-width: 3px; }
  .card.ok { border-left-color: var(--green); }
  .card.error { border-left-color: var(--red); }
  .card.checking { border-left-color: var(--amber); }
  .card.unknown { border-left-color: var(--border); }
  .card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
  .card-name { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .card-name i { font-size: 15px; color: var(--text-muted); }
  .badge { font-size: 11px; font-weight: 500; padding: 3px 8px; border-radius: 6px; }
  .badge.ok { background: rgba(74,222,128,0.12); color: var(--green); }
  .badge.error { background: rgba(248,113,113,0.12); color: var(--red); }
  .badge.checking { background: rgba(251,146,60,0.12); color: var(--amber); }
  .badge.unknown { background: var(--bg3); color: var(--text-muted); }
  .card-detail { font-size: 12px; color: var(--text-muted); }
  .card-latency { font-size: 11px; color: var(--text-muted); margin-top: 3px; }
  .puzzle-card { background: var(--bg2); border: 1px solid var(--border); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 16px; }
  .section-label { font-size: 10px; letter-spacing: 2px; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }
  .puzzle-row { display: flex; justify-content: space-between; font-size: 13px; color: var(--text-muted); padding: 4px 0; border-bottom: 1px solid var(--border); }
  .puzzle-row:last-child { border-bottom: none; }
  .puzzle-row span:last-child { color: var(--text); font-weight: 500; text-align: right; max-width: 65%; }
  .last-checked { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 8px; }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <div>
      <div class="title">The Game Forge</div>
      <div class="subtitle">SERVICE STATUS DASHBOARD</div>
    </div>
    <button class="refresh-btn" id="refreshBtn" onclick="runChecks()">
      <i class="ti ti-refresh"></i> Refresh
    </button>
  </div>

  <div class="overall" id="overall">
    <div class="overall-dot checking" id="overallDot"></div>
    <div>
      <div class="overall-text" id="overallText">Checking all services...</div>
      <div class="overall-sub" id="overallSub">Please wait</div>
    </div>
  </div>

  <div class="grid">
    <div class="card unknown" id="card-worker">
      <div class="card-top"><div class="card-name"><i class="ti ti-server"></i>Worker API</div><span class="badge unknown">—</span></div>
      <div class="card-detail">Puzzle API endpoint</div><div class="card-latency"></div>
    </div>
    <div class="card unknown" id="card-puzzle">
      <div class="card-top"><div class="card-name"><i class="ti ti-puzzle"></i>Today's Puzzle</div><span class="badge unknown">—</span></div>
      <div class="card-detail">KV cache + content</div><div class="card-latency"></div>
    </div>
    <div class="card unknown" id="card-github">
      <div class="card-top"><div class="card-name"><i class="ti ti-brand-github"></i>GitHub Pages</div><span class="badge unknown">—</span></div>
      <div class="card-detail">Frontend hosting</div><div class="card-latency"></div>
    </div>
    <div class="card unknown" id="card-clerk">
      <div class="card-top"><div class="card-name"><i class="ti ti-lock"></i>Clerk Auth</div><span class="badge unknown">—</span></div>
      <div class="card-detail">Google OAuth</div><div class="card-latency"></div>
    </div>
    <div class="card unknown" id="card-stats">
      <div class="card-top"><div class="card-name"><i class="ti ti-chart-bar"></i>Score API</div><span class="badge unknown">—</span></div>
      <div class="card-detail">Community stats</div><div class="card-latency"></div>
    </div>
    <div class="card unknown" id="card-kv">
      <div class="card-top"><div class="card-name"><i class="ti ti-database"></i>KV Store</div><span class="badge unknown">—</span></div>
      <div class="card-detail">Puzzle cache</div><div class="card-latency"></div>
    </div>
  </div>

  <div class="puzzle-card" id="puzzleCard" style="display:none">
    <div class="section-label">Today's puzzle</div>
    <div id="puzzleDetails"></div>
  </div>

  <div class="last-checked" id="lastChecked"></div>
</div>

<script>
const WORKER = 'https://lineup-puzzle-generator.sinhautkarsh-1.workers.dev';
const GAME = 'https://thegameforge.win';
const CLERK = 'https://clerk.thegameforge.win';

function setCard(id, status, detail, latency) {
  const card = document.getElementById('card-' + id);
  const badge = card.querySelector('.badge');
  const detailEl = card.querySelector('.card-detail');
  const latencyEl = card.querySelector('.card-latency');
  card.className = 'card ' + status;
  badge.className = 'badge ' + status;
  badge.textContent = status === 'ok' ? 'Operational' : status === 'error' ? 'Down' : status === 'checking' ? 'Checking...' : '—';
  if (detail) detailEl.textContent = detail;
  if (latency !== null) latencyEl.textContent = latency + 'ms';
}

async function ping(url, timeout = 8000) {
  const t = Date.now();
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), timeout);
  try {
    const res = await fetch(url, { signal: controller.signal, cache: 'no-store' });
    clearTimeout(timer);
    return { ok: res.ok, status: res.status, latency: Date.now() - t, res };
  } catch (e) {
    clearTimeout(timer);
    return { ok: false, status: 0, latency: Date.now() - t, error: e.message };
  }
}

async function runChecks() {
  const btn = document.getElementById('refreshBtn');
  btn.classList.add('spinning'); btn.disabled = true;
  ['worker','puzzle','github','clerk','stats','kv'].forEach(id => setCard(id, 'checking', null, null));
  document.getElementById('overallDot').className = 'overall-dot checking';
  document.getElementById('overallText').textContent = 'Checking all services...';
  document.getElementById('overallSub').textContent = 'Please wait';

  let allOk = true; const errors = [];

  const workerResult = await ping(WORKER + '?bust=' + Date.now());
  if (workerResult.ok) {
    setCard('worker', 'ok', 'Responding normally', workerResult.latency);
    try {
      const puzzle = await workerResult.res.clone().json();
      if (puzzle.category && puzzle.items) {
        setCard('puzzle', 'ok', puzzle.category + ' — Day #' + (puzzle.dayNum || '?'), workerResult.latency);
        setCard('kv', 'ok', 'Puzzle cached and valid', workerResult.latency);
        document.getElementById('puzzleCard').style.display = 'block';
        document.getElementById('puzzleDetails').innerHTML =
          `<div class="puzzle-row"><span>Day</span><span>#${puzzle.dayNum || '?'}</span></div>
           <div class="puzzle-row"><span>Category</span><span>${puzzle.category}</span></div>
           <div class="puzzle-row"><span>Question</span><span>${(puzzle.question||'').replace(/<[^>]+>/g,'')}</span></div>
           <div class="puzzle-row"><span>Items</span><span>${puzzle.items.map(i=>i.name).join(', ')}</span></div>`;
      } else if (puzzle.error) {
        setCard('puzzle', 'error', puzzle.error, null);
        setCard('kv', 'error', 'Generation failed', null);
        errors.push('Puzzle: ' + puzzle.error); allOk = false;
      }
    } catch { setCard('puzzle', 'error', 'Parse error', null); setCard('kv', 'error', 'Parse error', null); allOk = false; }
  } else {
    setCard('worker', 'error', 'HTTP ' + workerResult.status, workerResult.latency);
    setCard('puzzle', 'error', 'Worker unreachable', null);
    setCard('kv', 'error', 'Worker unreachable', null);
    errors.push('Worker down'); allOk = false;
  }

  const today = new Date().toISOString().split('T')[0];
  const statsResult = await ping(WORKER + '/stats?date=' + today);
  if (statsResult.ok) {
    try {
      const stats = await statsResult.res.clone().json();
      setCard('stats', 'ok', stats.total + ' players today, avg score ' + stats.avg, statsResult.latency);
    } catch { setCard('stats', 'ok', 'Responding', statsResult.latency); }
  } else { setCard('stats', 'error', 'HTTP ' + statsResult.status, statsResult.latency); errors.push('Stats API down'); allOk = false; }

  const githubResult = await ping(GAME);
  if (githubResult.ok) setCard('github', 'ok', 'thegameforge.win responding', githubResult.latency);
  else { setCard('github', 'error', 'HTTP ' + githubResult.status, githubResult.latency); errors.push('Frontend down'); allOk = false; }

  const clerkResult = await ping('https://clerk.thegameforge.win/npm/@clerk/clerk-js@latest/dist/clerk.browser.js');
  if (clerkResult.ok || clerkResult.status === 404 || clerkResult.status === 302 || clerkResult.status === 200)
    setCard('clerk', 'ok', 'Auth endpoint reachable', clerkResult.latency);
  else { setCard('clerk', 'error', 'HTTP ' + clerkResult.status, clerkResult.latency); errors.push('Clerk down'); allOk = false; }

  const dot = document.getElementById('overallDot');
  document.getElementById('overallText').textContent = allOk ? 'All systems operational' : 'Service degradation detected';
  document.getElementById('overallSub').textContent = allOk ? 'Worker, KV, Auth, and Frontend responding normally' : errors.join(' · ');
  dot.className = 'overall-dot ' + (allOk ? 'ok' : 'error');
  document.getElementById('lastChecked').textContent = 'Last checked: ' + new Date().toLocaleTimeString();
  btn.classList.remove('spinning'); btn.disabled = false;
}

runChecks();
setInterval(runChecks, 60000);
</script>
</body>
</html>
